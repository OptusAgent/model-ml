<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Protótipo do app de sinais com modelo validado por Walk Forward. Dados simulados.">
  <title>Sinal Lab · Esmathe Capital</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/esmathe-mark-claro.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="loading" id="loading">
    <div class="box">
      <img src="assets/img/esmathe-logo.png" alt="Esmathe Capital">
      <div class="spinner"></div>
      <b>Treinando o modelo no histórico…</b>
      <span class="muted">Walk Forward, cofre e teste contra o acaso (dados simulados)</span>
    </div>
  </div>
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="overlay"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
