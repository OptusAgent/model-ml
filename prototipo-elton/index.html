<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Protótipo do app de sinais com modelo validado por Walk Forward. Dados simulados.">
  <title>Sinal Lab · Protótipo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f6bff'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="loading" id="loading">
    <div class="box">
      <div class="spinner"></div>
      <b>Treinando o modelo no histórico…</b>
      <span class="muted">Walk Forward, cofre e teste contra o acaso (dados simulados)</span>
    </div>
  </div>
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="overlay"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
